name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e .

      - name: Install mypy
        run: pip install mypy

      - name: Import smoke
        run: python -c "import modules.main, checks, datasources"

      - name: Registry smoke
        run: |
          python -c "
          from checks.core.registry import CheckRegistry
          n = len(CheckRegistry.get_all_checks())
          assert n > 40, f'only {n} checks registered'
          print(f'{n} checks registered')
          "

      - name: Type check
        run: python -m mypy --ignore-missing-imports --follow-imports=silent checks/core/
